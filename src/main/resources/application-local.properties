# Local development runs against the same MySQL instance as every other profile, so
# there is a single source of truth. The datasource settings are inherited from
# application.properties (override with DB_URL / DB_USERNAME / DB_PASSWORD).
#
# Note: the H2 profiles need NON_KEYWORDS=MONTH,YEAR because `month` and `year` are
# reserved words in H2 2.x. MySQL accepts both, so it is not needed here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=local-dev-secret-key-replace-in-prod
app.jwt.expiration-ms=86400000

# Local development only. Never reuse this value outside a developer machine.
app.credentials.encryption-key=local-dev-credentials-encryption-key-replace-in-prod
