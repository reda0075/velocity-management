# NON_KEYWORDS matches src/test/resources/application.properties. `month` and `year`
# are reserved words in H2 2.x; without this, creating the `velocities` table fails
# with a syntax error, which aborts the rest of the hbm2ddl export and leaves the
# schema without that table, breaking every velocity query. MySQL tolerates both.
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=local-dev-secret-key-replace-in-prod
app.jwt.expiration-ms=86400000
