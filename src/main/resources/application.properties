# ===============================
# JWT
# ===============================
# No default value: the application refuses to start unless JWT_SECRET
# is supplied, so no secret is ever committed to the repository.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ===============================
# COLLABORATOR INITIAL CREDENTIALS
# ===============================
# Encrypts the initial password of a generated collaborator so an administrator can
# display it again later. Must be set in every deployed environment: the application
# refuses to start when it is blank. Rotating it makes previously issued passwords
# unreadable (they are not re-derivable).
app.credentials.encryption-key=${APP_CREDENTIAL_ENCRYPTION_KEY:}

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/velocity_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}