# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:4x5e9K7mP2vL8nQ1bR0aT6wU3yZ9xJ4cF7hG8mK1pL2o}
app.jwt.expiration-ms=86400000

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/velocity_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}