  services:
    backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: velocity-management-backend
      ports:
        - "8080:8080"
      environment:
          DB_URL: ${DB_URL}
          DB_USERNAME: ${DB_USERNAME}
          DB_PASSWORD: ${DB_PASSWORD}
          # Both are mandatory: the application refuses to start
          # when either is missing. Values come from the .env file.
          JWT_SECRET: ${JWT_SECRET}
          APP_CREDENTIAL_ENCRYPTION_KEY: ${APP_CREDENTIAL_ENCRYPTION_KEY}
          SPRING_PROFILES_ACTIVE: docker
      extra_hosts:
        - "host.docker.internal:host-gateway"
      restart: unless-stopped

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: velocity-management-frontend
      ports:
          - "8081:80"
      depends_on:
        - backend
      restart: unless-stopped
