  services:
    backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: velocity-management-backend
      ports:
        - "8080:8080"
      environment:
          DB_URL: ${DB_URL}
          DB_USERNAME: ${DB_USERNAME}
          DB_PASSWORD: ${DB_PASSWORD}
          SPRING_PROFILES_ACTIVE: docker
      extra_hosts:
        - "host.docker.internal:host-gateway"
      restart: unless-stopped

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: velocity-management-frontend
      ports:
          - "8081:80"
      depends_on:
        - backend
      restart: unless-stopped
