<app-modal [title]="'New Team Velocity Calculation'" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="tv-form">

    <label class="field">
      <span class="field__label">Team</span>
      <select class="field__input" formControlName="teamId">
        <option value="" disabled>Select a team</option>
        @for (t of teams(); track t.id) {
          <option [value]="t.id">{{ t.name }}</option>
        }
      </select>
      @if (form.controls['teamId'].invalid && form.controls['teamId'].touched) {
        <span class="field__error">Team is required.</span>
      }
    </label>

    <div class="tv-form__row">
      <label class="field">
        <span class="field__label">Year</span>
        <input class="field__input" type="number" formControlName="year" />
        @if (form.controls['year'].invalid && form.controls['year'].touched) {
          <span class="field__error">Year must be 2000 or later.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Month</span>
        <select class="field__input" formControlName="month">
          <option value="" disabled>Select a month</option>
          <option [value]="1">January</option>
          <option [value]="2">February</option>
          <option [value]="3">March</option>
          <option [value]="4">April</option>
          <option [value]="5">May</option>
          <option [value]="6">June</option>
          <option [value]="7">July</option>
          <option [value]="8">August</option>
          <option [value]="9">September</option>
          <option [value]="10">October</option>
          <option [value]="11">November</option>
          <option [value]="12">December</option>
        </select>
        @if (form.controls['month'].invalid && form.controls['month'].touched) {
          <span class="field__error">Month is required.</span>
        }
      </label>
    </div>

    @if (backendError()) {
      <div class="tv-form__banner">{{ backendError() }}</div>
    }

    <div class="tv-form__actions">
      <button class="btn btn-secondary" type="button" (click)="closed.emit()">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Calculating...' : 'Calculate' }}
      </button>
    </div>
  </form>
</app-modal>
